<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7b2ff7"/>
      <stop offset="100%" style="stop-color:#f107a3"/>
    </linearGradient>
  </defs>
  <rect width="800" height="160" fill="url(#bg)" rx="12"/>
  <rect y="148" width="800" height="4" fill="url(#accent)" rx="2"/>
  <!-- lock icon -->
  <g transform="translate(60,45)">
    <rect x="8" y="28" width="54" height="38" rx="5" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M18 28 V20 C18 8 52 8 52 20 V28" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="35" cy="46" r="5" fill="url(#accent)"/>
    <line x1="35" y1="51" x2="35" y2="58" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- title -->
  <text x="150" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="700" fill="white">gauth</text>
  <!-- subtitle -->
  <text x="152" y="102" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" fill="#a0a0c0">CLI TOTP / 2FA Authenticator &mdash; amd64 + arm64</text>
  <!-- brew badge -->
  <rect x="152" y="116" width="240" height="24" rx="4" fill="#1e1e3a"/>
